name: Windows checks and desktop build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # This is a non-secret UUID. When the release owner creates the approved
      # Entra registration, store it as a repository Actions variable so the
      # distributable works without end-user configuration.
      SMAXTEC_MICROSOFT_CLIENT_ID: ${{ vars.SMAXTEC_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked development dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --require-hashes -r requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\.venv\Scripts\python.exe -m pip install --no-deps --no-build-isolation -e .
          exit $LASTEXITCODE
      - name: Verify and build with bundled Chromium
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Build, install, smoke and uninstall Windows installer
        shell: pwsh
        run: ./scripts/build_installer.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SmaxTec-Workbench-windows-installer-preview
          path: |
            dist/SmaxTec-Workbench-Setup-*-windows-x64.exe
            dist/SmaxTec-Workbench-Setup-*-windows-x64.exe.sha256
          if-no-files-found: error
          retention-days: 14
